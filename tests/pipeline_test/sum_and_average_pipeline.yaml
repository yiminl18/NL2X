name: student_grade_analysis_pipeline
output_path: grade_with_average.json
properties:
  base_system: abstract
  parallel_execution: true
  max_parallel_workers: 4
nodes:
  sum_node:
    node_type: fanout
    procedure_path: sum_score_procedure.yaml
    data_sources:
      - type: file
        name: grade.json
        reference: grade.json
    outputs:
      - type: node
        name: average_node_input
        reference: average_node
      - type: node
        name: deviation_node_input
        reference: deviation_node
    metadata:
      description: First step - calculate total sum of scores (fanout to average and deviation)

  average_node:
    node_type: normal
    procedure_path: average_from_sum_procedure.yaml
    data_sources:
      - type: node
        name: sum_node_output
        reference: sum_node
    outputs:
      - type: node
        name: classify_node_input
        reference: classify_node
    metadata:
      description: Second step - calculate average from sum (feeds into classifier)

  median_node:
    node_type: normal
    procedure_path: median_score_procedure.yaml
    data_sources:
      - type: file
        name: grade.json
        reference: grade.json
    outputs:
      - type: node
        name: deviation_node_input
        reference: deviation_node
    metadata:
      description: Parallel step - calculate median of scores (feeds into deviation aggregate)

  deviation_node:
    node_type: final
    procedure_path: deviation_calculation_procedure.yaml
    data_sources:
      - type: node
        name: sum_node_output
        reference: sum_node
      - type: node
        name: median_node_output
        reference: median_node
    outputs:
      - type: file
        name: grade_with_deviation.json
        reference: grade_with_deviation.json
    metadata:
      description: Aggregate step - calculate deviation ratio from sum and median data

  classify_node:
    node_type: conditional_routing
    procedure_path: classify_students_procedure.yaml
    data_sources:
      - type: node
        name: average_node_output
        reference: average_node
    outputs:
      - type: node
        name: high_node_input
        reference: high_node
        output_name: high
      - type: node
        name: medium_node_input
        reference: medium_node
        output_name: medium
      - type: node
        name: low_node_input
        reference: low_node
        output_name: low
    metadata:
      description: Classify students by performance level based on average score
      routing_field: _performance_level

  high_node:
    node_type: final
    procedure_path: process_high_performers_procedure.yaml
    data_sources:
      - type: node
        name: classify_node_high_output
        reference: classify_node
        output_name: high
    outputs:
      - type: file
        name: high_performers.json
        reference: high_performers.json
    metadata:
      description: Process high-performing students (average >= 90)

  medium_node:
    node_type: final
    procedure_path: process_medium_performers_procedure.yaml
    data_sources:
      - type: node
        name: classify_node_medium_output
        reference: classify_node
        output_name: medium
    outputs:
      - type: file
        name: medium_performers.json
        reference: medium_performers.json
    metadata:
      description: Process medium-performing students (80 <= average < 90)

  low_node:
    node_type: final
    procedure_path: process_low_performers_procedure.yaml
    data_sources:
      - type: node
        name: classify_node_low_output
        reference: classify_node
        output_name: low
    outputs:
      - type: file
        name: low_performers.json
        reference: low_performers.json
    metadata:
      description: Process low-performing students (average < 80)

edges:
  sum_node:
    - average_node
    - deviation_node
  median_node:
    - deviation_node
  average_node:
    - classify_node
  classify_node:
    - high_node
    - medium_node
    - low_node
