name: student_grade_analysis_pipeline
output_path: grade_with_average.json
properties:
  description: Calculate sum and average of student grades using two-step pipeline
  base_system: abstract
  default_model: gpt-4o-mini
  created_by: manual creation

nodes:
  sum_node:
    node_type: normal
    procedure_path: sum_score_procedure.yaml
    data_sources:
      - type: file
        name: grade.json
        reference: grade.json
    outputs:
      - type: node
        name: average_node_input
        reference: average_node
    metadata:
      description: First step - calculate total sum of scores

  average_node:
    node_type: final
    procedure_path: average_from_sum_procedure.yaml
    data_sources:
      - type: node
        name: sum_node_output
        reference: sum_node
    outputs:
      - type: file
        name: grade_with_average.json
        reference: grade_with_average.json
    metadata:
      description: Second step - calculate average from sum

edges:
  sum_node:
    - average_node
