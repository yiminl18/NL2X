name: calculate_student_median
base_system: abstract
data_sources:
  - type: file
    name: grade.json
    reference: grade.json
outputs:
  - type: file
    name: grade_with_median.json
    reference: grade_with_median.json
properties:
  description: Calculate median score from three subject scores
  created_by: manual creation
dataset_schema:
  fields:
    name: String
    calculus: Integer
    physics: Integer
    biology: Integer
subtasks:
  - Calculate median score from calculus, physics, and biology grades
operators:
  - name: calculate_median
    type: PythonCode
    source:
      system: abstract
      name: calculate_median
    properties:
      function: |
        def process(sources):
            # Get input data from sources
            data = sources['input_data']

            # Calculate median for each student
            for record in data:
                calculus = record.get('calculus', 0)
                physics = record.get('physics', 0)
                biology = record.get('biology', 0)

                # Calculate median by sorting and taking the middle value
                scores = sorted([calculus, physics, biology])
                median = scores[1]  # Middle value for 3 items
                record['median_score'] = median

            # Return modified data
            return data
    input:
      fields:
        name: String
        calculus: Integer
        physics: Integer
        biology: Integer
    output:
      name: String
      calculus: Integer
      physics: Integer
      biology: Integer
      median_score: Integer
